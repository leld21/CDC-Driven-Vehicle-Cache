apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app: postgres
data:
  init.sql: |
    -- Source schema (docs/spec.md §3). No FK positions -> vehicles on purpose
    -- (ADR-005 orphan-position race). REPLICA IDENTITY DEFAULT (PK) is enough.
    CREATE TABLE IF NOT EXISTS vehicles (
        id         bigint      PRIMARY KEY,
        state      text        NOT NULL,
        updated_at timestamptz NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS positions (
        id          bigint      GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        vehicle_id  bigint      NOT NULL,
        lat         double precision NOT NULL,
        lng         double precision NOT NULL,
        recorded_at timestamptz NOT NULL
    );
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          # docker-entrypoint.sh prepends "postgres" when the first arg starts with "-"
          args:
            - "-c"
            - "wal_level=logical"
            - "-c"
            - "max_wal_senders=10"
            - "-c"
            - "max_replication_slots=10"
          env:
            - name: POSTGRES_USER
              value: nstech
            - name: POSTGRES_PASSWORD
              value: nstech
            - name: POSTGRES_DB
              value: nstech
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "nstech", "-d", "nstech"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "nstech", "-d", "nstech"]
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: initdb
          configMap:
            name: postgres-init
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
